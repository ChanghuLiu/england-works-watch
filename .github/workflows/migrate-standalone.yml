name: One-time standalone migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-standalone.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  SOURCE_REPO: https://github.com/ChanghuLiu/projectpermit-mcp.git

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Copy England Works Watch from legacy monorepo
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/projectpermit-mcp
          git clone --depth 1 "$SOURCE_REPO" /tmp/projectpermit-mcp
          cp -a /tmp/projectpermit-mcp/england-works-watch/. ./

          # Ordinary operational evidence can move with contents:write.
          # Other workflow files are added separately through the GitHub connector,
          # because GITHUB_TOKEN cannot create/update workflow files.
          mkdir -p .github/ops
          cp /tmp/projectpermit-mcp/.github/ops/england-works-watch-* .github/ops/ 2>/dev/null || true

          python - <<'PY'
          from pathlib import Path
          import json

          # Registry metadata now points at the standalone repository. A new
          # immutable registry version is required because 0.1.0 already exists.
          p = Path('server.json')
          data = json.loads(p.read_text())
          data['version'] = '0.1.1'
          data['repository'] = {
              'url': 'https://github.com/ChanghuLiu/england-works-watch',
              'source': 'github'
          }
          p.write_text(json.dumps(data, indent=2) + '\n')

          # Keep package/release metadata aligned with the migration release.
          p = Path('pyproject.toml')
          p.write_text(p.read_text().replace('version = "0.1.0"', 'version = "0.1.1"'))
          init = Path('src/england_works_watch/__init__.py')
          if init.exists():
              init.write_text(init.read_text().replace('0.1.0', '0.1.1'))

          # Rewrite explicit legacy repository links in standalone product text/config.
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or p.name == 'migrate-standalone.yml':
                  continue
              try:
                  text = p.read_text()
              except UnicodeDecodeError:
                  continue
              new = text.replace(
                  'https://github.com/ChanghuLiu/projectpermit-mcp/tree/main/england-works-watch',
                  'https://github.com/ChanghuLiu/england-works-watch'
              ).replace(
                  'https://github.com/ChanghuLiu/projectpermit-mcp/blob/main/england-works-watch',
                  'https://github.com/ChanghuLiu/england-works-watch/blob/main'
              )
              if new != text:
                  p.write_text(new)
          PY

          cat > .gitignore <<'EOF'
          __pycache__/
          *.py[cod]
          .pytest_cache/
          .venv/
          .env
          *.sqlite3
          *.db
          EOF

          rm -f .migration-init

      - name: Commit standalone snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No migration changes to commit.'
            exit 0
          fi
          git commit -m 'Migrate England Works Watch to standalone repository'
          git push origin HEAD:main
