name: Distribution API probe

on:
  push:
    branches:
      - distribution-probe-2026-09-11

permissions:
  contents: read

jobs:
  probe-serverhub:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe ServerHub payload key
        shell: bash
        run: |
          set +e
          for payload in \
            '{"url":"https://github.com/ChanghuLiu/england-works-watch"}' \
            '{"repositoryUrl":"https://github.com/ChanghuLiu/england-works-watch"}' \
            '{"repoUrl":"https://github.com/ChanghuLiu/england-works-watch"}' \
            '{"github":"https://github.com/ChanghuLiu/england-works-watch"}' \
            '{"github_url":"https://github.com/ChanghuLiu/england-works-watch"}' \
            '{"repository":"https://github.com/ChanghuLiu/england-works-watch"}'
          do
            echo "PAYLOAD=$payload"
            curl -sS -w '\nHTTP_STATUS=%{http_code}\n' -X POST 'https://www.serverhub.digital/api/submit' \
              -H 'Content-Type: application/json' --data "$payload"
            echo
          done
