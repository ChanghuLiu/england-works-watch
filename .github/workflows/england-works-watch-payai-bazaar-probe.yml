name: England Works Watch PayAI Bazaar Probe

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/england-works-watch-payai-bazaar-probe.yml'
      - '.github/ops/england-works-watch-paid-smoke.json'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Scan the complete PayAI Bazaar catalog for EWW
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          BASE = 'https://facilitator.payai.network/discovery/resources'
          PAY_TO = '0xDAAef0FD525278aAD0bA11066A96c338642A3d1A'.lower()
          ASSET = '0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913'.lower()
          NETWORK = 'eip155:8453'
          EXPECTED = {
              'assess_change_impact': '20000',
              'batch_assess_changes': '50000',
          }
          RESOURCE_HINTS = (
              'works.regevidencehub.com',
              'works.regevidencehub.com',
          )
          PAGE_SIZE = 1000

          def fetch_page(offset):
              # The public API supports limit/offset only. Filter the returned
              # catalog locally so the scan cannot silently ignore query fields.
              params = {'limit': PAGE_SIZE, 'offset': offset}
              url = BASE + '?' + urllib.parse.urlencode(params)
              req = urllib.request.Request(
                  url,
                  headers={
                      'Accept': 'application/json',
                      'User-Agent': 'England-Works-Watch-Bazaar-Probe/1.1',
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  payload = json.load(response)
              if not isinstance(payload, dict):
                  raise SystemExit('PAYAI_BAZAAR_UNEXPECTED_SHAPE: expected object')
              items = payload.get('items')
              pagination = payload.get('pagination')
              if not isinstance(items, list) or not isinstance(pagination, dict):
                  raise SystemExit('PAYAI_BAZAAR_UNEXPECTED_SHAPE ' + json.dumps(payload)[:1000])
              total = pagination.get('total')
              actual_offset = pagination.get('offset')
              if not isinstance(total, int) or actual_offset != offset:
                  raise SystemExit('PAYAI_BAZAAR_UNEXPECTED_PAGINATION ' + json.dumps(pagination))
              return items, total

          matches = []
          offset = 0
          total = None
          pages = 0
          while True:
              items, page_total = fetch_page(offset)
              total = page_total if total is None else page_total
              pages += 1
              for item in items:
                  if not isinstance(item, dict):
                      continue
                  bazaar = ((item.get('extensions') or {}).get('bazaar') or {}).get('info') or {}
                  info_input = bazaar.get('input') or {}
                  tool = info_input.get('toolName') or item.get('toolName')
                  resource = str(item.get('resource') or '')
                  if tool not in EXPECTED and not any(hint in resource for hint in RESOURCE_HINTS):
                      continue
                  accepts = item.get('accepts') or []
                  valid_terms = [
                      term for term in accepts
                      if isinstance(term, dict)
                      and term.get('scheme') == 'exact'
                      and term.get('network') == NETWORK
                      and str(term.get('payTo') or '').lower() == PAY_TO
                      and str(term.get('asset') or '').lower() == ASSET
                  ]
                  matches.append({
                      'resource': resource,
                      'toolName': tool,
                      'lastUpdated': item.get('lastUpdated'),
                      'expectedPaymentTerms': [
                          term for term in valid_terms
                          if tool in EXPECTED and str(term.get('amount')) == EXPECTED[tool]
                      ],
                  })
              if not items or offset + len(items) >= page_total:
                  break
              offset += len(items)
              if pages > 1000:
                  raise SystemExit('PAYAI_BAZAAR_PAGINATION_GUARD: too many pages')

          valid_tools = {
              item['toolName']
              for item in matches
              if item['toolName'] in EXPECTED and item['expectedPaymentTerms']
          }
          print('catalog_total=' + str(total))
          print('pages_scanned=' + str(pages))
          print('england_matches=' + json.dumps(matches, sort_keys=True))
          print(
              'PAYAI_MCP_BAZAAR_LISTING='
              + ('PASS' if set(EXPECTED) <= valid_tools else 'PENDING_LISTING')
          )
          PY
