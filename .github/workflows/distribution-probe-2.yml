name: Distribution API probe 2

on:
  push:
    branches:
      - distribution-probe-2-2026-09-11

permissions:
  contents: read

jobs:
  submit-and-inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Submit EWW to Kiprio
        shell: bash
        run: |
          set +e
          curl -sS -w '\nHTTP_STATUS=%{http_code}\n' -X POST 'https://kiprio.com/api/mcp-submit' \
            -H 'Content-Type: application/json' \
            --data '{"github_url":"https://github.com/ChanghuLiu/england-works-watch","submitter":"ProjectPermit"}'

      - name: Submit EWW to MyMCPTools free listing
        shell: bash
        run: |
          set +e
          curl -sS -w '\nHTTP_STATUS=%{http_code}\n' -X POST 'https://mymcptools.com/api/submit' \
            -H 'Content-Type: application/json' \
            --data '{"toolName":"England Works Watch","description":"Evidence-backed Skilled Worker sponsor change-impact decisions for England via a production Model Context Protocol server.","github":"https://github.com/ChanghuLiu/england-works-watch","website":"https://england-works-watch-production.up.railway.app/mcp","category":"api","installType":"source","email":"launchcircle.server@gmail.com","website_url":""}'

      - name: Inspect exact FindMCP form rules and fields
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,re,html as h
          s=urllib.request.urlopen(urllib.request.Request('https://findmcp.app/submit',headers={'User-Agent':'Mozilla/5.0'}),timeout=30).read().decode('utf-8','ignore')
          for needle in ['public GitHub','installation instructions','Submission limit','name="repoUrl"','name="category"','name="transport"','name="install','name="email"','name="config','name="claude']:
            i=s.lower().find(needle.lower())
            if i>=0: print('\nMATCH',needle,'\n',h.unescape(re.sub('<[^>]+>',' ',s[max(0,i-800):i+2200])).replace('  ',' ')[:3500])
          form=re.search(r'<form[^>]+id="server-submission-form".*?</form>',s,re.I|re.S)
          if form:
            f=form.group(0)
            print('\nFIELDS')
            for tag in re.findall(r'<(?:input|textarea|select)\b[^>]*>',f,re.I):
              nm=re.search(r'name="([^"]+)"',tag,re.I)
              if nm: print(nm.group(1), re.sub(r'\s+',' ',tag)[:700])
            print('\nSELECT OPTIONS')
            for sm in re.finditer(r'<select[^>]+name="([^"]+)"[^>]*>(.*?)</select>',f,re.I|re.S):
              print(sm.group(1),re.findall(r'<option[^>]*value="([^"]*)"[^>]*>(.*?)</option>',sm.group(2),re.I|re.S))
          PY

      - name: Inspect MCPVault submit implementation
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse,re
          page='https://mcpvault.io/submit'; hdr={'User-Agent':'Mozilla/5.0'}
          s=urllib.request.urlopen(urllib.request.Request(page,headers=hdr),timeout=30).read().decode('utf-8','ignore')
          print('HTML_LEN',len(s))
          print('FORMS',re.findall(r'<form[^>]*>',s,re.I)[:10])
          for needle in ['/api/','fetch(','supabase','repository','github','submit']:
            i=s.lower().find(needle.lower())
            if i>=0: print('HTML',needle,s[max(0,i-500):i+1800].replace('\n',' ')[:2400])
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',s,re.I):
            url=urllib.parse.urljoin(page,src)
            try: js=urllib.request.urlopen(urllib.request.Request(url,headers=hdr),timeout=20).read().decode('utf-8','ignore')
            except: continue
            for needle in ['/api/','fetch(','from("servers','from("submissions','repoUrl','githubUrl','repositoryUrl']:
              i=js.find(needle)
              if i>=0:
                print('JS',url,needle,js[max(0,i-1000):i+2600].replace('\n',' ')[:4000]); break
          PY

      - name: Inspect MCPizy submit implementation
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse,re
          page='https://mcpizy.com/submit?tier=standard'; hdr={'User-Agent':'Mozilla/5.0'}
          s=urllib.request.urlopen(urllib.request.Request(page,headers=hdr),timeout=30).read().decode('utf-8','ignore')
          print('HTML_LEN',len(s)); print('FORMS',re.findall(r'<form[^>]*>',s,re.I)[:10])
          for needle in ['GitHub','repository','email','/api/','captcha','turnstile','standard']:
            i=s.lower().find(needle.lower())
            if i>=0: print('HTML',needle,s[max(0,i-600):i+1800].replace('\n',' ')[:2600])
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',s,re.I):
            url=urllib.parse.urljoin(page,src)
            try: js=urllib.request.urlopen(urllib.request.Request(url,headers=hdr),timeout=20).read().decode('utf-8','ignore')
            except: continue
            for needle in ['/api/submit','fetch(','githubUrl','repositoryUrl','email','turnstile']:
              i=js.find(needle)
              if i>=0:
                print('JS',url,needle,js[max(0,i-1200):i+3000].replace('\n',' ')[:4500]); break
          PY
