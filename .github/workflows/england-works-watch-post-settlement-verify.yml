name: England Works Watch Post-Settlement Verify

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/ops/england-works-watch-paid-smoke.json'
      - '.github/workflows/england-works-watch-post-settlement-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify paid analytics and complete PayAI Bazaar indexing
        run: python scripts/post_settlement_verify.py
